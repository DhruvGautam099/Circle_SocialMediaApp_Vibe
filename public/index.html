<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle — A Simple, Friendly Social Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand-logo" id="brand-logo-link">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" fill="none"/>
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
          </svg>
        </div>
        <span>Circle</span>
      </a>

      <div class="nav-links">
        <a href="/" class="nav-item active" id="nav-home-link">
          <svg class="icon" width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
          </svg>
          <span>Home</span>
        </a>
      </div>

      <div class="nav-user-section" id="nav-user-section">
        <!-- Dynamically injected via api.js -->
      </div>
    </div>
  </header>

  <!-- Main Feed Container -->
  <main class="main-container">
    
    <!-- Feed Selector Tabs: For You vs Following -->
    <nav class="feed-tabs" aria-label="Feed selection">
      <button class="feed-tab active" id="tab-for-you" data-feed="all">For You</button>
      <button class="feed-tab" id="tab-following" data-feed="following">Following</button>
    </nav>

    <!-- Post Creator Card -->
    <div class="composer-card" id="composer-card">
      <div class="composer-body">
        <div id="composer-avatar-slot"></div>
        <div class="composer-input-area">
          <textarea 
            id="post-content-input" 
            class="composer-textarea" 
            placeholder="What's happening in your circle?" 
            maxlength="280"
            rows="3"
          ></textarea>
        </div>
      </div>
      <div class="composer-footer">
        <span class="char-counter" id="char-counter">0 / 280</span>
        <button id="submit-post-btn" class="btn btn-primary btn-sm" disabled>
          <span>Post</span>
        </button>
      </div>
    </div>

    <!-- Login prompt banner if viewing while logged out -->
    <div id="guest-prompt" class="empty-state" style="display: none; margin-bottom: 1.5rem; padding: 1.25rem;">
      <p class="empty-title" style="font-size: 0.95rem;">Join the conversation on Circle</p>
      <p class="empty-desc" style="margin-bottom: 0.75rem;">Log in to post thoughts, like, comment, and follow others.</p>
      <a href="/login.html" class="btn btn-primary btn-sm">Log In or Sign Up</a>
    </div>

    <!-- Posts Stream -->
    <section class="posts-stream" id="posts-stream" aria-label="Timeline of posts">
      <!-- Loading placeholder -->
      <div class="loading-state" id="posts-loading">
        <div class="spinner"></div>
        <span>Loading posts...</span>
      </div>
    </section>

  </main>

  <script src="/js/api.js"></script>
  <script src="/js/feed.js"></script>
</body>
</html>
