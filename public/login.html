<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In or Sign Up — Circle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Simple Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" fill="none"/>
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
          </svg>
        </div>
        <span>Circle</span>
      </a>
      <a href="/" class="btn btn-ghost btn-sm">Back to Feed</a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" fill="none"/>
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
          </svg>
        </div>
        <h1 class="auth-title" id="auth-heading">Welcome to Circle</h1>
        <p class="auth-subtitle" id="auth-subheading">A friendly place for simple moments.</p>
      </div>

      <!-- Auth Switcher Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" type="button">Log In</button>
        <button class="auth-tab" id="tab-signup" type="button">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-username">Username</label>
          <input 
            type="text" 
            id="login-username" 
            class="form-input" 
            placeholder="e.g. alice" 
            required 
            autocomplete="username"
            autofocus
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input 
            type="password" 
            id="login-password" 
            class="form-input" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="login-submit-btn">
          <span>Log In</span>
        </button>
      </form>

      <!-- Register Form -->
      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="register-display-name">Display Name (Optional)</label>
          <input 
            type="text" 
            id="register-display-name" 
            class="form-input" 
            placeholder="e.g. Alice Walker" 
            maxlength="50"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="register-username">Username</label>
          <input 
            type="text" 
            id="register-username" 
            class="form-input" 
            placeholder="e.g. alicew" 
            required 
            maxlength="20"
            pattern="[a-zA-Z0-9_]+"
            title="Letters, numbers and underscores only"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="register-password">Password</label>
          <input 
            type="password" 
            id="register-password" 
            class="form-input" 
            placeholder="At least 6 characters" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="register-submit-btn">
          <span>Create Account</span>
        </button>
      </form>

      <!-- Demo Accounts Box -->
      <div class="demo-credentials-box">
        <p>💡 Quick Demo Accounts (password: <code style="font-weight: bold; color: var(--text-main);">password123</code>):</p>
        <div class="demo-account-list">
          <div><button type="button" class="demo-badge" data-user="alice">alice</button> (Alice Walker)</div>
          <div><button type="button" class="demo-badge" data-user="bob">bob</button> (Bob Vance)</div>
          <div><button type="button" class="demo-badge" data-user="charlie">charlie</button> (Charlie Rose)</div>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
