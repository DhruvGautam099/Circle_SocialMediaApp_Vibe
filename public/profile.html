<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — Circle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Sticky Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" fill="none"/>
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
          </svg>
        </div>
        <span>Circle</span>
      </a>

      <div class="nav-links">
        <a href="/" class="nav-item">
          <svg class="icon" width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
          </svg>
          <span>Home</span>
        </a>
      </div>

      <div class="nav-user-section" id="nav-user-section">
        <!-- Dynamically injected via api.js -->
      </div>
    </div>
  </header>

  <!-- Profile Content Container -->
  <main class="main-container">
    
    <!-- User Profile Header Card -->
    <section class="profile-card" id="profile-card">
      <div class="loading-state" id="profile-loading">
        <div class="spinner"></div>
        <span>Loading profile...</span>
      </div>

      <div id="profile-content" style="display: none;">
        <div class="profile-top">
          <div class="profile-identity">
            <div id="profile-avatar-slot"></div>
            <div class="profile-titles">
              <h1 id="profile-display-name"></h1>
              <span class="profile-username" id="profile-username"></span>
            </div>
          </div>
          <div id="profile-action-slot">
            <!-- Edit Profile OR Follow / Unfollow button -->
          </div>
        </div>

        <p class="profile-bio" id="profile-bio"></p>

        <div class="profile-meta-row">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" style="color: var(--text-light);">
            <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/>
          </svg>
          <span id="profile-join-date"></span>
        </div>

        <div class="profile-stats-row">
          <div class="stat-item">
            <span class="stat-num" id="stat-posts">0</span>
            <span class="stat-label">Posts</span>
          </div>
          <div class="stat-item">
            <span class="stat-num" id="stat-followers">0</span>
            <span class="stat-label">Followers</span>
          </div>
          <div class="stat-item">
            <span class="stat-num" id="stat-following">0</span>
            <span class="stat-label">Following</span>
          </div>
        </div>
      </div>
    </section>

    <!-- User's Posts Section -->
    <div style="margin-bottom: 0.85rem; padding-left: 0.25rem;">
      <h2 style="font-size: 1.1rem; font-weight: 700; color: var(--text-main);">Posts</h2>
    </div>

    <section class="posts-stream" id="user-posts-stream" aria-label="User's posts">
      <!-- Injected dynamically via profile.js -->
    </section>

  </main>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="edit-profile-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Edit Profile</h3>
        <button type="button" class="btn btn-ghost btn-sm" id="close-modal-btn">✕</button>
      </div>

      <form id="edit-profile-form">
        <div class="form-group">
          <label class="form-label" for="edit-display-name">Display Name</label>
          <input 
            type="text" 
            id="edit-display-name" 
            class="form-input" 
            maxlength="50" 
            required
          >
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4rem;">
            <label class="form-label" for="edit-bio" style="margin-bottom: 0;">Bio</label>
            <span class="char-counter" id="edit-bio-counter">0 / 160</span>
          </div>
          <textarea 
            id="edit-bio" 
            class="form-textarea" 
            maxlength="160" 
            rows="3" 
            placeholder="Tell your circle a little bit about yourself..."
          ></textarea>
        </div>

        <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-outline btn-sm" id="cancel-edit-btn">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm" id="save-profile-btn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
